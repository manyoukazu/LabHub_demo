<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#162d3e"><title>LabHub — アイデアが、次の研究につながる。</title><link rel="stylesheet" href="/style.css"></head>
<body>
<main><header class="top-header"><div class="header-left"><div class="brand-group"><a class="brand" href="/" aria-label="LabHub ホーム"><span class="brand-icon">✳</span> LabHub<span class="brand-dot">.</span></a></div></div><div class="header-right"><button id="export" title="JSONで書き出し">↓ 書き出す</button><button id="settings" aria-label="保存先の設定" title="保存先の設定">⚙</button></div></header><section class="page-heading"><div><h1 id="page-title">ひらめきが、つながる場所<span>.</span></h1></div><button class="primary" id="add"><span>＋</span> アイデアを追加</button></section><section class="summary"><div><span class="summary-icon blue">◈</span><div><small>研究室内の研究</small><strong id="lab-count">0</strong><span>件の知識</span></div></div><div><span class="summary-icon green">✧</span><div><small>先輩・教授のアイデア</small><strong id="spark-count">0</strong><span>個のひらめき</span></div></div><div><span class="summary-icon yellow">▧</span><div><small>関連する外部の研究</small><strong id="external-count">0</strong><span>件の発見</span></div></div></section><section class="workspace"><div class="toolbar"><div class="view-tabs"><button class="active" data-view="graph">⌘ グラフ</button><button data-view="list">▤ 一覧</button><button data-view="favorites">☆ お気に入り</button></div><span class="stock-total">全 <b id="total">0</b> 件</span><label class="search"><span>⌕</span><input id="search" placeholder="キーワード、タグ、人で探す" aria-label="ストックを検索"><kbd>/</kbd></label><select id="sort" aria-label="並び順"><option value="updated">更新が新しい順</option><option value="oldest">更新が古い順</option></select></div><div class="filters"><span>表示するもの</span><button data-kind="lab" class="chip selected"><i class="dot blue"></i> 研究室内の研究</button><button data-kind="spark" class="chip selected"><i class="dot green"></i> ひらめき</button><button data-kind="external" class="chip selected"><i class="dot yellow"></i> 外部の研究</button><span id="result-count" class="result-count"></span></div><div class="canvas-layout"><div id="graph-panel"><svg id="graph" viewBox="0 0 1000 620" role="img" aria-label="研究とアイデアの関係性グラフ"></svg><div class="graph-footer"><div><button id="zoom-out" aria-label="縮小">−</button><button id="zoom-reset">100%</button><button id="zoom-in" aria-label="拡大">＋</button></div></div></div><div id="list-panel" hidden></div><aside id="detail" aria-label="アイデアの詳細"></aside></div></section></main>
<dialog id="editor"><form id="idea-form"><div class="dialog-top"><div><h2 id="editor-title">アイデアを残す</h2></div><button type="button" class="close" data-close="editor" aria-label="閉じる">×</button></div><input type="hidden" name="id"><label>タイトル <em>*</em><input name="title" required maxlength="160" placeholder="どんなことを思いつきましたか？"></label><div class="form-row"><label>分類<select name="kind"><option value="lab">青 · 研究室内の研究</option><option value="spark">緑 · 先輩・教授のアイデア</option><option value="external">黄 · 関連する外部の研究</option></select></label><label>発案者・研究者<input name="author" maxlength="80" placeholder="例：教授、先輩、自分"></label></div><label>メモ<textarea name="body" maxlength="10000" rows="4" placeholder="背景や、気になったこと。まずは一言でも。"></textarea></label><label>タグ（カンマ区切り）<input name="tags" placeholder="LLM, 自然言語処理, テーマ探し"></label><label>参考URL<input type="url" name="source" maxlength="2000" placeholder="論文や参考資料のURLを貼り付け（https://...）"></label><label>関連づけるストック<select name="related" multiple size="4"></select><small>Ctrl / ⌘ を押しながら複数選択</small></label><div class="dialog-actions"><button type="button" data-close="editor">キャンセル</button><button type="submit" class="primary">ストックに保存 ↗</button></div></form></dialog>
<dialog id="settings-dialog"><div class="dialog-top"><h2>保存先の設定</h2><button class="close" data-close="settings-dialog" aria-label="閉じる">×</button></div><p>デモはこのブラウザに保存されます。共有モードでは Cloudflare D1 に保存します。</p><label>研究室のアクセスキー<input type="password" id="token" autocomplete="off" placeholder="管理者が設定したキー"></label><small>キーはこのタブのメモリだけに保持します。再読み込み後は再入力が必要です。</small><div class="dialog-actions"><button id="demo-mode">デモに戻る</button><button class="primary" id="connect">共有モードに接続</button></div></dialog><div id="toast" role="status" aria-live="polite"></div><script type="module" src="/app.js"></script></body></html>
